services:
  db-ventas:
    image: mysql:8.0
    container_name: db-ventas-standalone
    restart: always
    environment:
      MYSQL_DATABASE: ventas_db
      MYSQL_USER: ventas_user
      MYSQL_PASSWORD: ventas_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - ventas-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-ventas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-ventas-standalone
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_ENDPOINT: db-ventas
      DB_PORT: 3306
      DB_NAME: ventas_db
      DB_USERNAME: ventas_user
      DB_PASSWORD: ventas_pass
      SPRING_DATASOURCE_URL: jdbc:mysql://db-ventas:3306/ventas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
    depends_on:
      db-ventas:
        condition: service_healthy

volumes:
  # Named volume: Docker manages MySQL files and preserves sales data across container restarts.
  ventas-data:
